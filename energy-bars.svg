<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" role="img" aria-label="Animated chart of daily energy use per appliance" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#43e97b"/><stop offset="100%" stop-color="#38f9d7"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffe259"/><stop offset="100%" stop-color="#ff9a8b"/></linearGradient>
  </defs>
  <rect width="900" height="340" rx="16" fill="#0d1224"/>
  <text x="30" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Daily energy use per appliance (kWh)</text>
  <text x="30" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#8fa3c7">Sample data bundled with the project</text>

  <g font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#dbe7ff">
    <!-- AC -->
    <text x="30" y="110">AC</text>
    <rect x="170" y="94" height="22" rx="6" fill="url(#g2)">
      <animate attributeName="width" values="0;540;540" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/></rect>
    <text x="720" y="110" fill="#ffe259" opacity="0">9.000
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.4;1" dur="7s" repeatCount="indefinite"/></text>

    <!-- Fan -->
    <text x="30" y="160">Fan (2 x 75W)</text>
    <rect x="170" y="144" height="22" rx="6" fill="url(#g1)">
      <animate attributeName="width" values="0;90;90" keyTimes="0;0.35;1" dur="7s" begin="0.2s" repeatCount="indefinite"/></rect>
    <text x="270" y="160" fill="#43e97b" opacity="0">1.500
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.4;1" dur="7s" begin="0.2s" repeatCount="indefinite"/></text>

    <!-- Laptop -->
    <text x="30" y="210">Laptop</text>
    <rect x="170" y="194" height="22" rx="6" fill="url(#g1)">
      <animate attributeName="width" values="0;16;16" keyTimes="0;0.35;1" dur="7s" begin="0.4s" repeatCount="indefinite"/></rect>
    <text x="196" y="210" fill="#43e97b" opacity="0">0.260
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.4;1" dur="7s" begin="0.4s" repeatCount="indefinite"/></text>

    <!-- LED -->
    <text x="30" y="260">LED Bulbs (3 x 9W)</text>
    <rect x="170" y="244" height="22" rx="6" fill="url(#g1)">
      <animate attributeName="width" values="0;10;10" keyTimes="0;0.35;1" dur="7s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="190" y="260" fill="#43e97b" opacity="0">0.162
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.4;1" dur="7s" begin="0.6s" repeatCount="indefinite"/></text>

    <!-- Chargers -->
    <text x="30" y="310">Mobile Chargers</text>
    <rect x="170" y="294" height="22" rx="6" fill="url(#g1)">
      <animate attributeName="width" values="0;4;4" keyTimes="0;0.35;1" dur="7s" begin="0.8s" repeatCount="indefinite"/></rect>
    <text x="184" y="310" fill="#43e97b" opacity="0">0.020
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.4;1" dur="7s" begin="0.8s" repeatCount="indefinite"/></text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="860" y="60" text-anchor="end" font-size="13" fill="#8fa3c7">Total / day</text>
    <text x="860" y="90" text-anchor="end" font-size="26" font-weight="800" fill="#ffe259">10.942 kWh
      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/></text>
  </g>
</svg>
