<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Smart Energy Consumption Tracker banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#101a3a"/>
      <stop offset="100%" stop-color="#0a2a2a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe259">
        <animate attributeName="stop-color" values="#ffe259;#43e97b;#38f9d7;#ffe259" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#43e97b">
        <animate attributeName="stop-color" values="#43e97b;#38f9d7;#ffe259;#43e97b" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#ffe259"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60H1000M0 120H1000M0 180H1000M0 240H1000"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300"/>
  </g>

  <!-- rising energy particles -->
  <g fill="#ffe259">
    <circle cx="80"  cy="300" r="3"><animate attributeName="cy" values="300;-10" dur="6s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6s"  repeatCount="indefinite"/></circle>
    <circle cx="190" cy="300" r="2"><animate attributeName="cy" values="300;-10" dur="8s"  begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="300" r="3"><animate attributeName="cy" values="300;-10" dur="7s"  begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="2"><animate attributeName="cy" values="300;-10" dur="9s"  begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="300" r="3"><animate attributeName="cy" values="300;-10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="300" r="2"><animate attributeName="cy" values="300;-10" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="300" r="3"><animate attributeName="cy" values="300;-10" dur="8.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- lightning bolt -->
  <g transform="translate(70,55)" filter="url(#glow)">
    <path d="M52 0 L8 78 H40 L28 140 L84 52 H50 Z" fill="#ffe259">
      <animate attributeName="opacity" values="1;0.55;1;1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="2.4s" additive="sum" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-30 0;0 0" dur="1s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    <text x="200" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#title)">Smart Energy</text>
    <text x="200" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#title)">Consumption Tracker</text>
  </g>

  <!-- cycling tagline -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="22" fill="#cfe8ff">
    <text x="200" y="225" opacity="0">Track every appliance. Know every unit.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="200" y="225" opacity="0">Linked Lists + Merge Sort, built from scratch in C.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
    <text x="200" y="225" opacity="0">Smart recommendations. Real savings.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- tech chips -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <g><rect x="200" y="250" width="50" height="26" rx="13" fill="#43e97b" fill-opacity="0.18" stroke="#43e97b"/><text x="225" y="268" fill="#43e97b">C</text></g>
    <g><rect x="262" y="250" width="64" height="26" rx="13" fill="#38f9d7" fill-opacity="0.18" stroke="#38f9d7"/><text x="294" y="268" fill="#38f9d7">GTK</text></g>
    <g><rect x="338" y="250" width="104" height="26" rx="13" fill="#ffe259" fill-opacity="0.18" stroke="#ffe259"/><text x="390" y="268" fill="#ffe259">Linked List</text></g>
    <g><rect x="454" y="250" width="110" height="26" rx="13" fill="#ff9a8b" fill-opacity="0.18" stroke="#ff9a8b"/><text x="509" y="268" fill="#ff9a8b">Merge Sort</text></g>
  </g>

  <!-- equalizer bars -->
  <g fill="url(#bar)">
    <rect x="780" y="230" width="22" height="40" rx="4"><animate attributeName="height" values="30;120;60;150;30" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="240;150;210;120;240" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="812" y="230" width="22" height="40" rx="4"><animate attributeName="height" values="90;40;140;70;90" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="180;230;130;200;180" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="844" y="230" width="22" height="40" rx="4"><animate attributeName="height" values="60;150;50;110;60" dur="2.0s" repeatCount="indefinite"/><animate attributeName="y" values="210;120;220;160;210" dur="2.0s" repeatCount="indefinite"/></rect>
    <rect x="876" y="230" width="22" height="40" rx="4"><animate attributeName="height" values="120;60;130;40;120" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="150;210;140;230;150" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="908" y="230" width="22" height="40" rx="4"><animate attributeName="height" values="40;100;70;140;40" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="230;170;200;130;230" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="770" y1="272" x2="940" y2="272" stroke="#ffffff" stroke-opacity="0.25"/>
</svg>
